title: Mimikatz Command Line Execution
id: 5b018596-f947-4972-87ad-d54d241773d4
status: stable
description: Detects execution of mimikatz via command line parameters
author: Florian Roth
date: 2017-02-14
tags:
    - attack.credential_access
    - attack.t1003.001
    - attack.t1003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'sekurlsa'
            - 'logonpasswords'
    condition: selection
falsepositives:
    - Penetration tests
level: high
